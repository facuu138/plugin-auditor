[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-auditor"
version = "0.1.0"
description = "Audit Claude Code plugins and skills: what is installed, where, and how much each is used."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Facundo Fernandez" }]
keywords = ["claude-code", "plugins", "skills", "mcp", "audit", "security", "dashboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/facuu138/plugin-auditor"
Demo = "https://facuu138.github.io/plugin-auditor/demo.html"

[project.scripts]
plugin-auditor = "plugin_auditor.cli:main"
cpa = "plugin_auditor.cli:main"  # short alias

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plugin_auditor = ["dashboard.html"]
